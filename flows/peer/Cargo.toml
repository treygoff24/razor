[package]
name = "flow-peer"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "A client that dials a Razor server through the network crate for the flows."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
razor-network = { path = "../../network" }
iroh = { workspace = true }
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "time", "io-util", "io-std", "net", "sync"] }
http = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.12", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1.0.154"
