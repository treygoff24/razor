# What the model reads around an input, and a live call's or a meeting's facts (RULES.md 16).
# Mail's headers are drawn when a request is rendered, so the record keeps the sender's words
# alone; each header goes before the words, and `{from}`, `{who}`, `{question}`, `{entry}` and
# `{status}` are filled in. A child's report gets `report`; an input from a program, a schedule,
# a heartbeat or Razor gets its line, and the person's words, an answer included, get none.
# `steer` follows the person's words that join a running turn, and no others.
parent = "{from} (your parent)"
child = "{from} (your child)"
report = "{from} (your child) reports {status}: "
program = "(From the program {from}, not from the person.)\n"
schedule = "(From your schedule {from}, not from the person.)\n"
heartbeat = "(From your heartbeat, not from the person.)\n"
razor = "(From Razor, not from the person.)\n"
note = "{who}: "
question = "{who} asks {question}: "
answer = "{who} answers #{entry}: "
mention = "{from} in the channel: "
cut = " ... (the rest: message read)"
attached = "\nAttached file: {path}"
image_origin = "\n[Image #{number}: copy {copy}; original at {path} on {device} stays on that device]"
image_scaled = "scaled"
image_pointer = "pointer only"
steer = "\n\n(Sent while you were working. Answer in a line before your next call.)"
voice = "(Voice note, transcribed by machine; some words may be misheard.)\n"
call = "(Said aloud on a live call and transcribed by machine; some words may be misheard.)\n"
call_started = "The person is on a live call. A voice speaks your words to them as they arrive, rewording them, and it has already acknowledged their request; don't restate their request. Talk like you're on the phone with them:\n- While working, speak up for a meaningful finding, a consequential change of direction, a problem they should know about, or a decision you need from them. Quiet while you work is fine; let routine steps pass without narration.\n- Give each shell command a description.\n- While you work, what the person says on the call reaches you as their own words. Act on a correction or new request at once and say so, and drop what it replaced without reporting it; ignore backchannel such as \"mm-hm\" or \"okay\".\n- End with the answer, as you'd say it aloud: the specifics that matter (times, names, amounts), no tables, lists, markdown or code unless asked.\n"
call_began = "The person was on a live call, which is no longer running.\n"
call_left_out = "({count} earlier lines of the call are left out; recall reads them.)\n"
call_person = "On the call, the person said: {text}\n"
call_voice = "On the call, your voice said: {text}\n"
call_ended = "The live call ended; the person reads your replies as usual again.\n"
meeting_started = "The person is in an in-person meeting, recording it on their phone, and you are following its live transcript. New lines reach you at the start of each turn, with the speaker and the time into the meeting; `meetrec live {folder} --since 30m` or `--grep` reads earlier parts. New lines never start your turn: answer what the person types. They read your replies on their phone during the meeting, so keep each to a line or two. Speaker labels are provisional; when the conversation makes a name clear, suggest it in words and the person will confirm it.\n"
meeting_line = "In the meeting (+{at}), {name} said: {text}\n"
meeting_named = "The person named Speaker {label} as {name}; later lines use the name.\n"
meeting_ended = "The person stopped recording the meeting. The full recording is uploading; when its final transcript with speakers is ready you will be asked for the notes.\n"
meeting_read = "`meetrec live {folder}` reads its transcript so far.\n"
meeting_canceled = "The person discarded the meeting's recording; there will be no final transcript.\n"
meeting_left_out = "({count} earlier lines of the meeting are left out; `meetrec live {folder}` reads them.)\n"
video = "(Video: {path}, {duration} long.)\n"
watching = "(Video: {path}, {duration} long. Your helper {name} is watching it on Gemini and will report a machine-made description and timeline of key moments, with frames; message it while it works, or continue it with questions after it reports.)\n"
