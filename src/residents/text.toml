# A stop signals the server alone, as launchd does: it outlives the bridge, so its open turns stay
# open and resume at the next start, and jobs it started live on for that start to take back.
unit = """
[Unit]
Description=Razor

[Service]
ExecStart="{command}"
Environment="PATH={path}" "RAZOR_HOME={home}"
KillMode=process
Restart=on-failure
RestartSec=60

[Install]
WantedBy=default.target
"""
plist = """
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>Label</key><string>{label}</string>
  <key>ProgramArguments</key><array><string>{command}</string></array>
  <key>EnvironmentVariables</key><dict>
    <key>PATH</key><string>{path}</string>
    <key>RAZOR_HOME</key><string>{home}</string>
  </dict>
  <key>RunAtLoad</key><true/>
  <key>KeepAlive</key><dict><key>SuccessfulExit</key><false/></dict>
  <key>ThrottleInterval</key><integer>60</integer>
  <key>StandardErrorPath</key><string>{home}/server.log</string>
</dict>
</plist>
"""
boot = "Razor's service is in {file} and running: it starts at boot, and again within a minute of a failure."
login = "Razor's service is in {file} and running: it starts when you log in, and again within a minute of a failure. On Linux, `loginctl enable-linger` makes it start at boot."
taken = "{file} runs the server of another Razor home, so it is left alone; give this home a folder of another name."
no_manager = "No user service manager enabled Razor, so {file} was removed; your next Razor command starts a detached server."
