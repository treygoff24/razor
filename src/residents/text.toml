# The text of residents, deliveries and the service: what the model or the person reads, and the
# files `razor install` writes (RULES.md 16). `{name}` is filled in.

ask = "When you have the result, end by asking the person about it with `message`, type `question`, `to` `parent` (your parent is the person)."
notify = "When you have the result, end by sending it to the person with `message`, type `note`, `to` `parent` (your parent is the person)."
option = "\n{n}. {option}"
identity_heading = "## Your identity record\n\nThis is `{path}`, yours to keep current: edit it with your file tools when something in it changes, and each edit is recorded as your own call."
identity_thread = "This session is one of your threads, with a fresh context: your home session, whose id is the id in your identity record, keeps the project's state note, so do not write one here; rulings, facts and notes are yours to write. When the person closes this thread with `/done`, send your home session, in place of a state note, a note with `message` (to the id in your identity record): what happened here and what it should keep. The thread starts named for you and a random word: once its subject is clear, rename it in a few words with the `agent` tool's `name` action, so the person can find it again."
identity = """
# The identity record of resident {name}. Each key is yours to keep current.
id = "{name}"
display_name = "{name}"
role = ""
authority = ""
values = []
relationships = []
operating_patterns = []
version = 1
# Who may change this record besides you.
changed_by = ["the person"]
"""
